server:
  port: ${PORT:8086}
  servlet:
    context-path: /api/v1
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 60s
    threads:
      max: 200
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
logging:
  structured:
    format:
      console: ecs
workflow:
  booking-url: ${BOOKING_API_URL:http://booking-api:8083/api/v1/booking}
  http:
    timeout-seconds: ${HTTP_TIMEOUT_SECONDS:5}
    attempts: ${HTTP_ATTEMPTS:3}
    backoff-ms: ${HTTP_BACKOFF_MS:200}
